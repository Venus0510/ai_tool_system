<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>内控鉴证 · 项目背景与建设必要性</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <style id="token-css">
    :root {
      --bw-primary-50:#eff6ff;--bw-primary-100:#dbeafe;--bw-primary-200:#bfdbfe;--bw-primary-300:#93c5fd;
      --bw-primary-500:#2563eb;--bw-primary-700:#1e3a8a;--bw-primary-800:#1e40af;--bw-primary-900:#0f172a;
      --bw-surface:#ffffff;--bw-surface-alt:#f8fafc;--bw-bg:#f3f6fb;
      --bw-text:#1f2937;--bw-text-muted:#64748b;--bw-text-light:#94a3b8;
      --bw-border:#e5e7eb;--bw-border-light:#f1f5f9;
      --bw-accent-green:#16a34a;--bw-accent-red:#dc2626;--bw-accent-amber:#d97706;
      --bw-font:"Microsoft YaHei","PingFang SC",Arial,sans-serif;
      --bw-radius-card:14px;--bw-shadow-card:0 8px 24px rgba(15,23,42,0.08);
      --bw-process-border:4px solid var(--bw-primary-500);
      --bw-big-number:48px;--bw-big-number-color:var(--bw-primary-500);
      --bw-table-th-bg:var(--bw-primary-100);--bw-table-th-text:var(--bw-primary-700);
      --primary-50:var(--bw-primary-50);--primary-100:var(--bw-primary-100);--primary-200:var(--bw-primary-200);
      --primary-300:var(--bw-primary-300);--primary-500:var(--bw-primary-500);--primary-700:var(--bw-primary-700);
      --primary-800:var(--bw-primary-800);--primary-900:var(--bw-primary-900);
      --surface:var(--bw-surface);--surface-alt:var(--bw-surface-alt);--bg:var(--bw-bg);
      --text:var(--bw-text);--text-muted:var(--bw-text-muted);--text-light:var(--bw-text-light);
      --text-inverse:var(--bw-text-inverse);--border:var(--bw-border);--border-light:var(--bw-border-light);
      --radius-card:var(--bw-radius-card);--shadow-card:var(--bw-shadow-card);--font:var(--bw-font);
      --accent-green:var(--bw-accent-green);--accent-red:var(--bw-accent-red);--accent-amber:var(--bw-accent-amber);
      --big-number:var(--bw-big-number);--big-number-color:var(--bw-big-number-color);
      --process-border:var(--bw-process-border);--table-th-bg:var(--bw-table-th-bg);--table-th-text:var(--bw-table-th-text);
    }
  </style>
  <style>
    @page { size: A4 landscape; margin: 0; }
    .a4-page {
      width: 297mm; height: 210mm; padding: 18mm 22mm;
      box-sizing: border-box; page-break-after: always; break-after: page;
      position: relative; overflow: hidden;
    }
    .a4-page:last-child { page-break-after: auto; break-after: auto; }
    @media screen {
      html, body { background: #e5e7eb; margin: 0; padding: 0; }
      .a4-page {
        width: min(297mm, calc(100vw - 32px)); height: auto;
        aspect-ratio: 297 / 210; margin: 20px auto;
        box-shadow: 0 0 30px rgba(0,0,0,.12); border-radius: 4px;
      }
    }
    @media print {
      html, body { width: 297mm; height: 210mm; background: white; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .a4-page { width: 297mm; height: 210mm; aspect-ratio: auto; margin: 0; box-shadow: none; border-radius: 0; }
    }
    .stat-card {
      background: var(--surface); border-radius: var(--radius-card);
      padding: 18px 20px; box-shadow: var(--shadow-card);
      border: 1px solid var(--border-light);
    }
    .stat-card .num { font-size: 32px; color: var(--big-number-color); font-weight: 700; line-height: 1; margin-bottom: 6px; }
    .stat-card h3 { font-size: 16px; color: var(--primary-700); font-weight: 700; margin: 0 0 6px; }
    .stat-card p { font-size: 13px; color: var(--text-muted); line-height: 1.6; margin: 0; }
    .process-item {
      padding: 14px 18px; border-radius: 0 12px 12px 0; margin-bottom: 10px;
      border-left: var(--process-border); background: var(--surface);
      box-shadow: 0 4px 12px rgba(15,23,42,0.04);
    }
    .process-item h3 { font-size: 16px; color: var(--primary-700); font-weight: 700; margin: 0 0 4px; }
    .process-item p { font-size: 13px; color: var(--text-muted); line-height: 1.6; margin: 0; }
  </style>
</head>
<body style="background: var(--bg); font-family: var(--font), sans-serif;">

<div id="app">
  <section class="a4-page flex flex-col" style="background: var(--surface-alt);">
    <h2 class="text-3xl font-bold mb-1" style="color: var(--text);">第3章 项目背景与建设必要性</h2>
    <p class="text-base mb-5 max-w-3xl leading-relaxed" style="color: var(--text-muted);">
      市场影响、监管导向、行业升级三重驱动力叠加，推动估值内控建设进入系统化、规范化阶段。
    </p>

    <div class="flex-1">
      <div v-for="(d, i) in drivers" :key="i" class="process-item">
        <div class="flex items-center gap-3 mb-1">
          <span class="inline-flex items-center justify-center rounded-full w-8 h-8 text-sm font-bold" style="background: var(--primary-500); color: #fff;">{{ i + 1 }}</span>
          <h3>{{ d.title }}</h3>
        </div>
        <p>{{ d.desc }}</p>
      </div>
    </div>

    <div class="grid grid-cols-3 gap-4 mt-4">
      <div v-for="s in strengthCards" :key="s.title" class="stat-card flex flex-col justify-center">
        <div class="num">{{ s.label }}</div>
        <h3>{{ s.title }}</h3>
        <p>{{ s.desc }}</p>
      </div>
    </div>

    <div class="absolute bottom-[10mm] right-[22mm] text-xs" style="color: var(--text-light);">03</div>
  </section>
</div>

<script>
const { createApp } = Vue;
createApp({
  data() {
    return {
      drivers: [
        { title: '市场影响 — 第三方估值已成为定价基础设施', desc: '第三方估值机构已成为金融市场定价基础设施的重要组成部分，其估值结果被广泛应用于资管产品净值计量、公允价值计量、风险管理、业绩评价及审计支持，具有较强的市场普适性和外部依赖性。' },
        { title: '监管导向 — 从自我管理走向外部可验证', desc: '人民银行和交易商协会已明确鼓励估值机构聘请独立审计机构，对估值业务内控机制、估值产品编制流程及相关规则遵循情况进行定期评估，推动估值业务从自我管理走向外部可验证。' },
        { title: '行业升级 — 从「形成结果」到「可解释、可复核、可追溯、可挑战」', desc: '行业竞争和监管关注正在从"是否能够形成估值结果"，转向"估值结果是否可解释、可复核、可追溯、可挑战"。头部估值机构开展高质量内控建设，有助于提升市场公信力并形成行业示范。' },
      ],
      strengthCards: [
        { label: '广泛', title: '市场普适性', desc: '估值结果覆盖资管净值、公允计量、风控、业绩评价、审计支持等核心场景' },
        { label: '明确', title: '监管信号', desc: 'PBOC + NAFMII 鼓励独立审计机构定期评估估值内控机制与编制流程' },
        { label: '升级', title: '竞争力重构', desc: '高质量内控成为头部机构市场公信力与行业示范的核心壁垒' },
      ],
    };
  }
}).mount('#app');
</script>

</body>
</html>
