<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>内控鉴证 · 封面</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <style id="token-css">
    :root {
      --bw-primary-50:#eff6ff;--bw-primary-100:#dbeafe;--bw-primary-200:#bfdbfe;--bw-primary-300:#93c5fd;
      --bw-primary-500:#2563eb;--bw-primary-700:#1e3a8a;--bw-primary-800:#1e40af;--bw-primary-900:#0f172a;
      --bw-surface:#ffffff;--bw-surface-alt:#f8fafc;--bw-bg:#f3f6fb;
      --bw-text:#1f2937;--bw-text-muted:#64748b;--bw-text-light:#94a3b8;--bw-text-inverse:#ffffff;
      --bw-border:#e5e7eb;--bw-border-light:#f1f5f9;
      --bw-accent-green:#16a34a;--bw-accent-red:#dc2626;--bw-accent-amber:#d97706;
      --bw-font:"Microsoft YaHei","PingFang SC",Arial,sans-serif;
      --bw-radius-card:14px;--bw-shadow-card:0 8px 24px rgba(15,23,42,0.08);
      --bw-cover-bg:linear-gradient(135deg, var(--bw-primary-900), var(--bw-primary-700));
      --bw-big-number:48px;--bw-big-number-color:var(--bw-primary-500);
      --primary-50:var(--bw-primary-50);--primary-100:var(--bw-primary-100);--primary-200:var(--bw-primary-200);
      --primary-300:var(--bw-primary-300);--primary-500:var(--bw-primary-500);--primary-700:var(--bw-primary-700);
      --primary-800:var(--bw-primary-800);--primary-900:var(--bw-primary-900);
      --surface:var(--bw-surface);--surface-alt:var(--bw-surface-alt);--bg:var(--bw-bg);
      --text:var(--bw-text);--text-muted:var(--bw-text-muted);--text-light:var(--bw-text-light);
      --text-inverse:var(--bw-text-inverse);--border:var(--bw-border);--border-light:var(--bw-border-light);
      --radius-card:var(--bw-radius-card);--shadow-card:var(--bw-shadow-card);--font:var(--bw-font);
      --accent-green:var(--bw-accent-green);--accent-red:var(--bw-accent-red);--accent-amber:var(--bw-accent-amber);
      --big-number:var(--bw-big-number);--big-number-color:var(--bw-big-number-color);
      --cover-bg:var(--bw-cover-bg);
    }
  </style>
  <style>
    @page { size: A4 landscape; margin: 0; }
    .a4-page {
      width: 297mm; height: 210mm; padding: 18mm 22mm;
      box-sizing: border-box; page-break-after: always; break-after: page;
      position: relative; overflow: hidden;
    }
    .a4-page:last-child { page-break-after: auto; break-after: auto; }
    @media screen {
      html, body { background: #e5e7eb; margin: 0; padding: 0; }
      .a4-page {
        width: min(297mm, calc(100vw - 32px)); height: auto;
        aspect-ratio: 297 / 210; margin: 20px auto;
        box-shadow: 0 0 30px rgba(0,0,0,.12); border-radius: 4px;
      }
    }
    @media print {
      html, body { width: 297mm; height: 210mm; background: white; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .a4-page { width: 297mm; height: 210mm; aspect-ratio: auto; margin: 0; box-shadow: none; border-radius: 0; }
    }
  </style>
</head>
<body style="background: var(--bg); font-family: var(--font), sans-serif;">

<div id="app">
  <section class="a4-page flex flex-col justify-center" style="background: var(--cover-bg); color: var(--text-inverse);">
    <h1 class="text-5xl font-bold mb-3 leading-tight" style="color: var(--text-inverse);">
      金融工具估值内控建设与鉴证
    </h1>
    <p class="text-2xl font-light mb-5" style="color: rgba(255,255,255,0.8);">
      {{ cover.subtitle }}
    </p>
    <p class="text-base max-w-2xl mb-8 leading-relaxed" style="color: rgba(255,255,255,0.65);">
      {{ cover.intro }}
    </p>

    <div class="grid grid-cols-3 gap-5">
      <div v-for="card in cover.cards" :key="card.title" class="rounded-2xl p-5 shadow-lg" style="background: var(--surface); color: var(--text);">
        <div class="text-4xl font-bold mb-2" style="color: var(--big-number-color);">{{ card.num }}</div>
        <h3 class="text-lg font-bold mb-2" style="color: var(--primary-700);">{{ card.title }}</h3>
        <p class="text-sm leading-relaxed" style="color: var(--text-muted);">{{ card.desc }}</p>
      </div>
    </div>

    <div class="absolute bottom-[10mm] right-[22mm] text-xs" style="color: rgba(255,255,255,0.5);">01</div>
  </section>
</div>

<script>
const { createApp } = Vue;
createApp({
  data() {
    return {
      cover: {
        subtitle: '基于 IVS 500 与 ISAE 3402 的内控框架与实施路径',
        intro: '以国际评估准则（IVS）为框架基础，融合人民银行监管要求与交易商协会自律指引，构建覆盖治理、数据、方法、质控与持续改进的估值内控体系，并通过 ISAE 3402 鉴证实现控制有效性的外部验证。',
        cards: [
          { num: '5', title: '一级控制模块', desc: '覆盖治理基础、数据管理、方法模型、质量控制与持续改进五大领域' },
          { num: '13', title: '二级内控清单', desc: '可执行、可留痕、可复核的精细化控制点，支撑内外部检查与鉴证' },
          { num: '3 步', title: '实施路径', desc: '现状诊断 → 内控建设 → ISAE 3402 鉴证，分阶段推进、逐步验证' },
        ],
      },
    };
  }
}).mount('#app');
</script>

</body>
</html>
