<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>折线图 · Line Chart</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <link id="token-css" rel="stylesheet" href="../../tokens/business-bluewhite.css" />
  <style>
    body { margin: 0; padding: 32px 24px; background: var(--bg); font-family: var(--font); }
    .container { max-width: 1000px; margin: 0 auto; }
    .page-title h1 { color: var(--text); font-size: 28px; margin: 0 0 6px; }
    .page-title p { color: var(--text-muted); font-size: 14px; margin: 0 0 28px; }
    .chart-box { background: var(--surface); border-radius: var(--radius-card); padding: 24px; box-shadow: var(--shadow-card); border: 1px solid var(--border-light); margin-bottom: 24px; }
    .chart-box h3 { color: var(--text); font-size: 16px; margin: 0 0 16px; font-weight: 700; }
    .chart { width: 100%; height: 360px; }
  </style>
</head>
<body>

<div class="container">
  <div class="page-title">
    <h1>折线图 · Line Chart</h1>
    <p>基于 ECharts 5 的时序数据图表组件，支持折线面积图和双轴对比图。图表颜色通过 CSS 变量适配主题切换。</p>
  </div>

  <div class="chart-box">
    <h3>折线面积图 · 七日年化收益率走势（%）</h3>
    <div class="chart" id="chart1"></div>
  </div>

  <div class="chart-box">
    <h3>双轴对比图 · 规模 vs 收益率</h3>
    <div class="chart" id="chart2"></div>
  </div>
</div>

<script>
function getChartColors() {
  const style = getComputedStyle(document.documentElement);
  return {
    primary: style.getPropertyValue('--primary-500').trim() || '#2563eb',
    primaryLight: style.getPropertyValue('--primary-300').trim() || '#93c5fd',
    accent: style.getPropertyValue('--accent-green').trim() || '#16a34a',
    accentAmber: style.getPropertyValue('--accent-amber').trim() || '#d97706',
    accentRed: style.getPropertyValue('--accent-red').trim() || '#dc2626',
    textMuted: style.getPropertyValue('--text-muted').trim() || '#64748b',
    text: style.getPropertyValue('--text').trim() || '#1f2937',
    border: style.getPropertyValue('--border').trim() || '#e5e7eb',
  };
}

function buildCharts() {
  const c = getChartColors();
  const months = ['2025-07','2025-08','2025-09','2025-10','2025-11','2025-12','2026-01','2026-02','2026-03','2026-04'];

  // Chart 1: Line area - 七日年化收益率
  const c1 = echarts.init(document.getElementById('chart1'));
  c1.setOption({
    tooltip: { trigger: 'axis' },
    legend: { data: ['本产品', '同类均值', '业绩基准'], textStyle: { color: c.textMuted, fontSize: 12 }, bottom: 0 },
    grid: { left: '3%', right: '4%', bottom: '12%', containLabel: true },
    xAxis: { type: 'category', data: months, axisLabel: { color: c.textMuted, fontSize: 11 }, boundaryGap: false },
    yAxis: { type: 'value', name: '%', axisLabel: { color: c.textMuted }, nameTextStyle: { color: c.textMuted } },
    series: [
      {
        type: 'line', name: '本产品', data: [2.31, 2.28, 2.42, 2.45, 2.38, 2.52, 2.48, 2.56, 2.44, 2.50],
        lineStyle: { color: c.primary, width: 3 },
        itemStyle: { color: c.primary },
        areaStyle: { color: new echarts.graphic.LinearGradient(0,0,0,1,[
          { offset: 0, color: c.primaryLight }, { offset: 1, color: 'rgba(147,197,253,0.02)' }
        ])},
        smooth: true,
      },
      {
        type: 'line', name: '同类均值', data: [2.25, 2.22, 2.35, 2.38, 2.32, 2.40, 2.42, 2.44, 2.38, 2.42],
        lineStyle: { color: c.accent, width: 2, type: 'dashed' },
        itemStyle: { color: c.accent },
        smooth: true,
      },
      {
        type: 'line', name: '业绩基准', data: [2.20, 2.20, 2.20, 2.20, 2.20, 2.20, 2.20, 2.20, 2.20, 2.20],
        lineStyle: { color: c.textMuted, width: 1.5, type: 'dotted' },
        itemStyle: { color: c.textMuted },
        smooth: true,
      },
    ],
  });

  // Chart 2: Dual axis - 规模 vs 收益率
  const c2 = echarts.init(document.getElementById('chart2'));
  c2.setOption({
    tooltip: { trigger: 'axis' },
    legend: { data: ['产品规模(亿)', '七日年化(%)'], textStyle: { color: c.textMuted, fontSize: 12 }, bottom: 0 },
    grid: { left: '3%', right: '4%', bottom: '12%', containLabel: true },
    xAxis: { type: 'category', data: months, axisLabel: { color: c.textMuted, fontSize: 11 } },
    yAxis: [
      { type: 'value', name: '亿', axisLabel: { color: c.textMuted }, nameTextStyle: { color: c.textMuted } },
      { type: 'value', name: '%', axisLabel: { color: c.textMuted }, nameTextStyle: { color: c.textMuted } },
    ],
    series: [
      {
        type: 'bar', name: '产品规模(亿)', data: [186, 192, 205, 210, 198, 215, 220, 228, 218, 225],
        itemStyle: { color: c.primaryLight, borderRadius: [6, 6, 0, 0] }, barWidth: '45%',
      },
      {
        type: 'line', name: '七日年化(%)', yAxisIndex: 1,
        data: [2.31, 2.28, 2.42, 2.45, 2.38, 2.52, 2.48, 2.56, 2.44, 2.50],
        lineStyle: { color: c.accentRed, width: 2.5 },
        itemStyle: { color: c.accentRed },
        symbol: 'circle', symbolSize: 6,
      },
    ],
  });

  window.__charts = [c1, c2];
}

function disposeCharts() {
  if (window.__charts) { window.__charts.forEach(c => c.dispose()); window.__charts = []; }
}

buildCharts();

const urlTheme = new URLSearchParams(location.search).get('theme');
if (urlTheme) setTheme(urlTheme);
window.addEventListener('message', (e) => {
  if (e.data?.type === 'theme-change') setTheme(e.data.theme);
});
function setTheme(theme) {
  const link = document.querySelector('#token-css');
  if (link) {
    link.href = `../../tokens/${theme}.css`;
    link.addEventListener('load', () => { disposeCharts(); buildCharts(); }, { once: true });
  }
}
</script>
</body>
</html>
