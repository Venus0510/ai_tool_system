<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>UI 组件库 · 团队内部工具</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/prismjs@1/themes/prism.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-core.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/plugins/autoloader/prism-autoloader.min.js"></script>
  <link id="token-css" rel="stylesheet" href="tokens/business-bluewhite.css" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #app { height: 100%; overflow: hidden; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif; }

    .app-shell { display: flex; flex-direction: column; height: 100%; background: var(--bg); }
    .topbar { display: flex; align-items: center; justify-content: space-between; padding: 10px 20px; background: var(--surface); border-bottom: 1px solid var(--border-light); z-index: 10; flex-shrink: 0; }
    .main-area { display: flex; flex: 1; overflow: hidden; }
    .sidebar { width: 260px; flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--border-light); overflow-y: auto; }
    .content { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: var(--bg); }
    .preview-area { flex: 1; position: relative; }
    .preview-area iframe { width: 100%; height: 100%; border: none; background: #fff; }
    .preview-placeholder { display: flex; align-items: center; justify-content: center; height: 100%; color: var(--text-muted); font-size: 16px; }

    .code-panel { border-top: 2px solid var(--border); background: var(--surface); flex-shrink: 0; }
    .code-panel-header { display: flex; align-items: center; justify-content: space-between; padding: 8px 16px; border-bottom: 1px solid var(--border-light); }
    .code-tabs { display: flex; gap: 4px; }
    .code-tab { padding: 6px 14px; border-radius: 6px; border: none; cursor: pointer; font-size: 13px; font-weight: 600; background: transparent; color: var(--text-muted); }
    .code-tab.active { background: var(--primary-100); color: var(--primary-700); }
    .code-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn { padding: 6px 14px; border-radius: 6px; border: 1px solid var(--border); cursor: pointer; font-size: 13px; font-weight: 600; background: var(--surface); color: var(--text); white-space: nowrap; display: inline-flex; align-items: center; gap: 4px; }
    .btn:hover { background: var(--surface-alt); }
    .btn.primary { background: var(--primary-500); color: #fff; border-color: var(--primary-500); }
    .btn.primary:hover { background: var(--primary-700); }
    .btn.small { padding: 3px 10px; font-size: 11px; }
    .code-body { overflow: auto; max-height: 240px; }
    .code-body pre { margin: 0; padding: 16px; font-size: 13px; line-height: 1.5; }
    .code-body code { font-family: "SF Mono", "Cascadia Code", "Fira Code", monospace; }

    .logo { font-size: 18px; font-weight: 800; color: var(--primary-700); letter-spacing: .02em; }
    .theme-btns { display: flex; gap: 6px; }
    .theme-btn { padding: 5px 14px; border-radius: 999px; border: 1.5px solid var(--border); cursor: pointer; font-size: 12px; font-weight: 600; background: var(--surface); color: var(--text-muted); transition: all .15s ease; }
    .theme-btn.active { background: var(--primary-500); color: #fff; border-color: var(--primary-500); }

    /* menu groups */
    .menu-group { border-bottom: 1px solid var(--border-light); }
    .menu-group-header { display: flex; align-items: center; gap: 8px; padding: 10px 16px; cursor: pointer; font-size: 14px; font-weight: 700; color: var(--text); user-select: none; transition: background .1s; }
    .menu-group-header:hover { background: var(--surface-alt); }
    .menu-group-header .arrow { font-size: 10px; transition: transform .15s ease; color: var(--text-muted); display: inline-block; }
    .menu-group-header .arrow.open { transform: rotate(90deg); }
    .menu-group-header .count { margin-left: auto; font-size: 11px; color: var(--text-light); font-weight: 500; }
    .menu-items { overflow: hidden; }
    .menu-item { padding: 9px 16px 9px 40px; cursor: pointer; font-size: 13px; color: var(--text-muted); border-left: 3px solid transparent; transition: all .12s ease; display: block; }
    .menu-item:hover { color: var(--text); background: var(--surface-alt); }
    .menu-item.active { color: var(--primary-500); background: var(--primary-50); border-left-color: var(--primary-500); font-weight: 600; }
    .menu-item-empty { padding: 8px 16px 8px 40px; color: var(--text-light); font-size: 12px; }

    .basket-count { display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px; border-radius: 999px; background: var(--primary-500); color: #fff; font-size: 10px; font-weight: 700; padding: 0 5px; }
    .overlay { display: none; position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,0.3); }

    @media (max-width: 768px) {
      .sidebar { position: fixed; left: 0; top: 0; bottom: 0; z-index: 50; width: 260px; transform: translateX(-100%); transition: transform .2s ease; }
      .sidebar.mobile-open { transform: translateX(0); }
      .overlay.show { display: block; }
      .topbar { padding: 8px 12px; }
      .logo { font-size: 15px; }
      .theme-btn { padding: 4px 10px; font-size: 11px; }
      .code-panel-header { flex-direction: column; gap: 8px; align-items: flex-start; }
      .code-body { max-height: 160px; }
    }
  </style>
</head>
<body>
<div id="app">

  <div class="app-shell">
    <!-- ====== 顶部栏 ====== -->
    <header class="topbar">
      <div style="display:flex;align-items:center;gap:12px;">
        <button @click="mobileMenuOpen = true" class="btn small" :style="{display: isMobile ? 'inline-flex' : 'none'}">☰</button>
        <span class="logo">UI 组件库</span>
        <span v-if="basketCount" class="basket-count">{{ basketCount }}</span>
      </div>
      <div class="theme-btns">
        <span style="font-size:12px;color:var(--text-muted);font-weight:600;margin-right:2px;">切换主题</span>
        <button v-for="t in themes" :key="t.id" @click="switchTheme(t.id)"
                class="theme-btn" :class="{ active: currentTheme === t.id }">{{ t.label }}</button>
      </div>
    </header>

    <div class="main-area">
      <!-- 手机端遮罩 -->
      <div class="overlay" :class="{ show: mobileMenuOpen }" @click="mobileMenuOpen = false"></div>

      <!-- ====== 左侧多级菜单 ====== -->
      <aside class="sidebar" :class="{ 'mobile-open': mobileMenuOpen }">
        <!-- 菜单树（滚动区） -->
        <nav class="menu-scroll" style="flex:1;overflow-y:auto;">
          <div v-for="group in menuTree" :key="group.id" class="menu-group">
            <!-- 一级菜单：可展开/收起 -->
            <div class="menu-group-header" @click="toggleGroup(group.id)">
              <span class="arrow" :class="{ open: openGroups[group.id] }">▶</span>
              <span>{{ group.label }}</span>
              <span class="count" v-if="group.children.length">{{ group.children.length }}项</span>
            </div>
            <!-- 二级菜单项 -->
            <div class="menu-items" v-show="openGroups[group.id]">
              <div v-for="item in group.children" :key="item.id"
                   class="menu-item" :class="{ active: selectedItem?.id === item.id }"
                   @click="selectItem(item, group)">
                {{ item.label }}
              </div>
              <div v-if="!group.children.length" class="menu-item-empty">暂无组件</div>
            </div>
          </div>
        </nav>
      </aside>

      <!-- ====== 右侧内容区 ====== -->
      <main class="content">
        <!-- iframe 预览区 -->
        <div class="preview-area">
          <iframe v-if="selectedItem" :key="iframeKey" :src="iframeSrc" ref="previewFrame"
                  @load="onIframeLoad" style="width:100%;height:100%;border:none;"></iframe>
          <div v-else class="preview-placeholder">
            ← 从左侧菜单选择一个组件开始预览
          </div>
        </div>

        <!-- 代码面板 -->
        <div class="code-panel" v-if="selectedItem">
          <div class="code-panel-header">
            <div class="code-tabs">
              <button class="code-tab" :class="{ active: activeTab === 'code' }" @click="switchTab('code')">完整代码</button>
              <button class="code-tab" :class="{ active: activeTab === 'meta' }" @click="switchTab('meta')" v-if="selectedItem._meta">元信息 JSON</button>
            </div>
            <div class="code-actions">
              <button class="btn small" @click="copyCode">📋 复制代码</button>
              <button class="btn small" @click="copyMeta" v-if="selectedItem._meta && metaContent">📋 复制元信息</button>
              <button class="btn small primary" @click="addToBasket">🧺 加入提示词篮</button>
              <button class="btn small" @click="codePanelOpen = !codePanelOpen">
                {{ codePanelOpen ? '▼ 收起' : '▲ 展开' }}
              </button>
            </div>
          </div>
          <div class="code-body" v-show="codePanelOpen">
            <pre v-if="activeTab === 'code'"><code class="language-html">{{ sourceCode }}</code></pre>
            <pre v-else><code class="language-json">{{ metaContent }}</code></pre>
          </div>
        </div>
      </main>
    </div>
  </div>

</div>

<script>
/* === 组件注册表（内联，避免 file:// 协议下 fetch CORS 限制） === */
const MANIFEST_MENU = [
  {
    id: 'basic-components', label: '基础组件', icon: 'component', defaultOpen: true,
    children: [
      { id: 'stat-card',     label: '数据卡片', path: 'components/stat-card/stat-card.html',         theme: 'follow', _meta: {"name":"stat-card","label":"数据卡片","category":"基础组件","description":"单指标数据卡片，支持大数字编号、标题、描述文本，三种变体（大数字/简单/顶部色条）","props":{"variant":{"type":"enum","values":["numbered","simple","accent-top"],"desc":"卡片变体：numbered=带大数字编号，simple=纯标题描述，accent-top=顶部色条"},"num":{"type":"string","desc":"大数字编号（variant=numbered 时使用）"},"title":{"type":"string","required":true,"desc":"卡片标题"},"desc":{"type":"string","required":true,"desc":"卡片描述文本"}},"slots":[],"cssPath":"../tokens/business-bluewhite.css","echarts":false,"usage":"<div class=\"stat-card\">\n  <div class=\"num\">01</div>\n  <h3>卡片标题</h3>\n  <p>卡片描述内容。</p>\n</div>","promptHint":"适用于展示 KPI 指标、业绩数据、统计概览、核心能力等场景。可组合成网格布局使用。"} },
      { id: 'timeline',      label: '时间线',   path: 'components/timeline/timeline.html',           theme: 'follow', _meta: {"name":"timeline","label":"时间线","category":"基础组件","description":"展示按时间顺序排列的关键节点。支持水平横轴和垂直纵轴两种布局。每个节点包含圆形标记、标题和描述卡片。","props":{"direction":{"type":"enum","values":["horizontal","vertical"],"desc":"布局方向：horizontal=水平横轴（4列网格），vertical=垂直纵轴"},"nodes":{"type":"array","desc":"节点数组，每项含 year/label（圆形标记文字）、color（圆形背景色）、title、desc"}},"slots":[],"cssPath":"../tokens/business-bluewhite.css","echarts":false,"usage":"<div class=\"timeline-h\">\n  <div class=\"node\">\n    <div class=\"dot\" style=\"background:#0f5a96;\">2014</div>\n    <div class=\"card\"><h3>节点标题</h3><p>描述</p></div>\n  </div>\n</div>","promptHint":"适用于政策演进时间线、项目里程碑、历史发展脉络、产品迭代记录等场景。"} },
      { id: 'process-step',  label: '流程步骤', path: 'components/process-step/process-step.html',   theme: 'follow', _meta: {"name":"process-step","label":"流程步骤","category":"基础组件","description":"左侧色条流程步骤卡片，用于展示递进式流程、方法步骤、报告结构。支持左右色条两种变体。","props":{"side":{"type":"enum","values":["left","right"],"desc":"色条位置：left=左侧（默认），right=右侧"},"step":{"type":"number","desc":"步骤序号"},"title":{"type":"string","required":true,"desc":"步骤标题"},"desc":{"type":"string","required":true,"desc":"步骤描述文本"}},"slots":[],"cssPath":"../tokens/business-bluewhite.css","echarts":false,"usage":"<div class=\"process-step\">\n  <h3>1. 步骤标题</h3>\n  <p>步骤描述内容。</p>\n</div>","promptHint":"适用于报告方法步骤、项目流程展示、递进式论证、操作流程说明等场景。"} },
      { id: 'circle-number', label: '圆形编号', path: 'components/circle-number/circle-number.html', theme: 'follow', _meta: {"name":"circle-number","label":"圆形编号","category":"基础组件","description":"圆形数字/文字编号，用于目录模块编号、步骤指示、章节标记。支持四种尺寸，可选阴影和实色反白。","props":{"size":{"type":"enum","values":["sm","md","lg","xl"],"desc":"尺寸：sm=44px，md=66px，lg=110px，xl=140px"},"variant":{"type":"enum","values":["default","shadow","accent"],"desc":"变体：default=浅底深字，shadow=带阴影，accent=实色反白"},"text":{"type":"string","required":true,"desc":"编号文字，如 一/二/三 或 01/02/03"}},"slots":[],"cssPath":"../tokens/business-bluewhite.css","echarts":false,"usage":"<span class=\"circle-num circle-md\">一</span>","promptHint":"适用于演示文稿目录、报告模块编号、步骤圆形指示器等场景。"} },
      { id: 'badge-tag',     label: '标签徽章', path: 'components/badge-tag/badge-tag.html',         theme: 'follow', _meta: {"name":"badge-tag","label":"标签徽章","category":"基础组件","description":"圆角标签/徽章组件，支持填充、描边、实色、带点四种风格，小/默认/大三种尺寸","props":{"style":{"type":"enum","values":["fill","outline","accent","dot"],"desc":"徽章风格：fill=浅底深字，outline=描边，accent=实色反白，dot=带状态点"},"size":{"type":"enum","values":["sm","md","lg"],"desc":"尺寸：sm=小号，md=默认，lg=大号"},"label":{"type":"string","required":true,"desc":"标签文本"}},"slots":[],"cssPath":"../tokens/business-bluewhite.css","echarts":false,"usage":"<span class=\"badge badge-fill\">T+1 至 T+3</span>","promptHint":"适用于时间标签、分类标记、状态指示、模块标识等场景。"} },
      { id: 'data-table',    label: '数据表格', path: 'components/data-table/data-table.html',       theme: 'follow', _meta: {"name":"data-table","label":"数据表格","category":"基础组件","description":"带主题色表头的数据表格组件，支持斑马纹、紧凑、全边框三种变体。","props":{"striped":{"type":"boolean","desc":"是否启用斑马纹（隔行变色）"},"compact":{"type":"boolean","desc":"是否使用紧凑模式（减小内边距和字号）"},"bordered":{"type":"boolean","desc":"是否显示全边框（单元格边框）"},"columns":{"type":"array","desc":"列定义数组，每项含 label 字段"},"rows":{"type":"array","desc":"行数据数组"}},"slots":[],"cssPath":"../tokens/business-bluewhite.css","echarts":false,"usage":"<table class=\"data-table\">\n  <thead><tr><th>列A</th><th>列B</th></tr></thead>\n  <tbody><tr><td>数据</td><td>数据</td></tr></tbody>\n</table>","promptHint":"适用于数据分析表、对比表、流程说明表、规格参数表等场景。"} },
      { id: 'hero-card',     label: '封面卡片', path: 'components/hero-card/hero-card.html',         theme: 'follow', _meta: {"name":"hero-card","label":"封面卡片","category":"基础组件","description":"用于封面页或重点区域的卡片组合。支持三种模式：浅色卡片叠加深色渐变背景、暗色区半透明卡片、统计数字卡片。","props":{"mode":{"type":"enum","values":["light-on-dark","dark-section","stat-grid"],"desc":"卡片模式：light-on-dark=浅色卡片+深色渐变背景，dark-section=暗色区+半透明卡片，stat-grid=统计数字网格"},"heading":{"type":"string","desc":"区域标题"},"sub":{"type":"string","desc":"区域副标题/描述"},"items":{"type":"array","desc":"卡片数据数组"}},"slots":[],"cssPath":"../tokens/business-bluewhite.css","echarts":false,"usage":"<section class=\"hero-section\">\n  <h2>报告标题</h2>\n  <p class=\"sub\">描述文本</p>\n  <div class=\"hero-cards\">\n    <div class=\"hero-card\"><h3>卡片标题</h3><p>描述</p></div>\n  </div>\n</section>","promptHint":"适用于报告封面、团队介绍、产品亮点展示、核心指标概览等场景。"} },
    ]
  },
  {
    id: 'charts', label: '图表', icon: 'chart', defaultOpen: false,
    children: [
      { id: 'bar-chart',       label: '柱状图',   path: 'charts/bar-chart/bar-chart.html',           theme: 'follow', _meta: {"name":"bar-chart","label":"柱状图","category":"图表","description":"基于 ECharts 5 的可主题切换柱状图组件。支持垂直柱状、横向柱状、分组柱状三种布局。","props":{"layout":{"type":"enum","values":["vertical","horizontal","grouped"],"desc":"柱状图布局：vertical=垂直，horizontal=横向，grouped=分组"},"data":{"type":"object","desc":"图表数据：categories（类别数组）、series（系列数组）"},"height":{"type":"string","desc":"图表高度，默认 360px"},"title":{"type":"string","desc":"图表标题"}},"slots":[],"cssPath":"../tokens/business-bluewhite.css","echarts":true,"usage":"<div class=\"chart\" id=\"myChart\" style=\"width:100%;height:360px;\"></div>\n<script>\n  const chart = echarts.init(document.getElementById('myChart'));\n  chart.setOption({ /* ECharts 配置 */ });\n<\/script>","promptHint":"适用于数据对比、收益归因展示、排名分析、月度趋势等场景。需要引入 ECharts 5 CDN。"} },
      { id: 'timeline-chart',  label: '时间线图', path: 'charts/timeline-chart/timeline-chart.html', theme: 'follow', _meta: {"name":"timeline-chart","label":"时间线图","category":"图表","description":"基于 ECharts 5 的时序数据图表组件，支持折线面积图和双轴对比图（柱状+折线）。","props":{"layout":{"type":"enum","values":["line-area","dual-axis"],"desc":"图表类型：line-area=折线面积图，dual-axis=双轴对比图"},"data":{"type":"object","desc":"图表数据：categories（时间轴数组）、series（系列数组）"},"height":{"type":"string","desc":"图表高度，默认 360px"},"smooth":{"type":"boolean","desc":"折线是否平滑，默认 true"}},"slots":[],"cssPath":"../tokens/business-bluewhite.css","echarts":true,"usage":"<div class=\"chart\" id=\"myChart\" style=\"width:100%;height:360px;\"></div>\n<script>\n  const chart = echarts.init(document.getElementById('myChart'));\n  chart.setOption({ /* ECharts 配置，含 xAxis/yAxis/series */ });\n<\/script>","promptHint":"适用于时间序列分析、收益率走势图、规模变化趋势、多指标对比等场景。需要引入 ECharts 5 CDN。"} },
    ]
  },
  {
    id: 'layouts', label: '版式骨架', icon: 'layout', defaultOpen: true,
    children: [
      { id: 'a4-landscape', label: 'A4 横版',   path: 'skeletons/a4-landscape-skeleton.html', meta: null, theme: 'follow' },
      { id: 'slide-deck',   label: 'Slide 翻页', path: 'skeletons/slide-deck-skeleton.html',   meta: null, theme: 'follow' },
      { id: 'scroll-page',  label: '自由滚动',   path: 'skeletons/scroll-page-skeleton.html',  meta: null, theme: 'follow' },
    ]
  },
  {
    id: 'token-preview', label: 'Token 预览', icon: 'palette', defaultOpen: false,
    children: [
      { id: 'token-palette', label: '三套色板对比', path: 'previews/token-preview.html', meta: null, theme: 'fixed' },
    ]
  },
  {
    id: 'templates', label: '完整案例', icon: 'file', defaultOpen: false,
    children: [
      { id: 'combo-a4-bluewhite', label: 'A4 + 商务蓝白',   path: 'templates/combo-a4-bluewhite.html', meta: null, theme: 'fixed' },
      { id: 'combo-slide-rc',     label: 'Slide + RC 浅蓝', path: 'templates/combo-slide-rc.html',     meta: null, theme: 'fixed' },
      { id: 'combo-scroll-dark',  label: '滚动 + 暗黑科技', path: 'templates/combo-scroll-dark.html',  meta: null, theme: 'fixed' },
    ]
  },
];

const { createApp } = Vue;
createApp({
  data() {
    const openGroups = {};
    MANIFEST_MENU.forEach(g => { if (g.defaultOpen) openGroups[g.id] = true; });
    return {
      currentTheme: 'business-bluewhite',
      themes: [
        { id: 'business-bluewhite', label: '商务蓝白' },
        { id: 'rc-lightblue', label: 'RC 浅蓝' },
        { id: 'dark-tech', label: '暗黑科技' },
      ],
      menuTree: MANIFEST_MENU,
      openGroups,
      selectedItem: null,
      activeTab: 'code',
      sourceCode: '',
      metaContent: '',
      codePanelOpen: true,
      promptBasket: [],
      iframeKey: 0,
      isMobile: window.innerWidth < 768,
      mobileMenuOpen: false,
    };
  },
  computed: {
    basketCount() {
      return this.promptBasket.length;
    },
    iframeSrc() {
      if (!this.selectedItem) return '';
      let src = this.selectedItem.path;
      const sep = src.includes('?') ? '&' : '?';
      if (this.selectedItem.theme === 'follow') {
        src += `${sep}theme=${this.currentTheme}`;
      }
      if (this.selectedItem.params) {
        const p = new URLSearchParams(this.selectedItem.params).toString();
        src += (src.includes('?') ? '&' : '?') + p;
      }
      return src;
    },
  },
  methods: {
    toggleGroup(id) {
      this.openGroups[id] = !this.openGroups[id];
    },
    selectItem(item, group) {
      this.selectedItem = { ...item, category: group?.label };
      this.activeTab = 'code';
      this.codePanelOpen = true;
      this.mobileMenuOpen = false;

      // 元信息：从内联 _meta 读取，并合并路径信息
      if (item._meta) {
        const fullMeta = {
          sourcePath: item.path,
          tokenPath: 'tokens/business-bluewhite.css',
          cssVars: ['--primary-50','--primary-100','--primary-200','--primary-300','--primary-400','--primary-500','--primary-700','--primary-800','--primary-900','--surface','--surface-alt','--bg','--text','--text-muted','--text-light','--text-inverse','--border','--border-light','--radius-card','--radius-tag','--radius-circle','--shadow-card','--font','--font-display','--accent-green','--accent-red','--accent-amber','--big-number','--big-number-color','--process-border','--table-th-bg','--table-th-text','--tag-bg','--tag-text','--cover-bg'],
          ...item._meta
        };
        this.metaContent = JSON.stringify(fullMeta, null, 2);
      } else {
        this.metaContent = '';
      }

      // 源代码：优先 fetch/XHR，失败则等 iframe onLoad 回退
      this.sourceCode = '';
      this.loadSourceCode(item.path);

      this.iframeKey++;
    },
    async loadSourceCode(path) {
      try {
        const resp = await fetch(path);
        if (resp.ok) { this.sourceCode = await resp.text(); this.$nextTick(() => this.highlightCode()); return; }
      } catch (e) { /* fetch 失败 */ }
      try {
        const text = await new Promise((resolve, reject) => {
          const xhr = new XMLHttpRequest();
          xhr.open('GET', path, true);
          xhr.onload = () => { if (xhr.status === 200 || xhr.status === 0) resolve(xhr.responseText); else reject(new Error('XHR')); };
          xhr.onerror = () => reject(new Error('XHR'));
          xhr.send();
        });
        this.sourceCode = text;
        this.$nextTick(() => this.highlightCode());
      } catch (e) { /* XHR 失败，等 iframe onLoad 回退 */ }
    },
    switchTheme(themeId) {
      this.currentTheme = themeId;
      const link = document.querySelector('#token-css');
      if (link) link.href = `tokens/${themeId}.css`;

      // 通知已加载的 iframe
      const iframe = this.$refs.previewFrame;
      if (iframe && iframe.contentWindow) {
        iframe.contentWindow.postMessage({ type: 'theme-change', theme: themeId }, '*');
      }

      // follow 主题的组件：重载 iframe 以更新 URL 参数
      if (this.selectedItem?.theme === 'follow') {
        this.iframeKey++;
      }
    },
    switchTab(tab) {
      this.activeTab = tab;
      this.$nextTick(() => this.highlightCode());
    },
    highlightCode() {
      requestAnimationFrame(() => {
        const blocks = document.querySelectorAll('#app pre code');
        blocks.forEach(b => {
          if (b.textContent && b.textContent.trim()) {
            try { Prism.highlightElement(b); } catch (e) { /* ignore */ }
          }
        });
      });
    },
    onIframeLoad() {
      if (this.sourceCode) return;
      const iframe = this.$refs.previewFrame;
      if (!iframe) return;
      try {
        const doc = iframe.contentDocument || iframe.contentWindow.document;
        if (doc && doc.documentElement) {
          this.sourceCode = '<!DOCTYPE html>\n' + doc.documentElement.outerHTML;
          this.$nextTick(() => this.highlightCode());
        }
      } catch (e) { /* 跨域读取失败 */ }
    },
    copyCode() {
      if (this.sourceCode) {
        navigator.clipboard.writeText(this.sourceCode).then(() => {
          this.showToast('代码已复制');
        }).catch(() => {
          this.showToast('复制失败，请手动复制');
        });
      } else {
        this.showToast('源代码尚未加载，请等待预览完成');
      }
    },
    copyMeta() {
      if (!this.metaContent) { this.showToast('无元信息可复制'); return; }
      navigator.clipboard.writeText(this.metaContent).then(() => {
        this.showToast('元信息已复制');
      }).catch(() => {
        this.showToast('复制失败');
      });
    },
    addToBasket() {
      if (!this.selectedItem) return;
      const exists = this.promptBasket.find(b => b.id === this.selectedItem.id);
      if (exists) { this.showToast('已在提示词篮中'); return; }
      this.promptBasket.push({
        id: this.selectedItem.id,
        label: this.selectedItem.label,
        path: this.selectedItem.path,
        category: this.selectedItem.category,
        meta: this.selectedItem._meta || null,
        addedAt: new Date().toISOString(),
      });
      localStorage.setItem('prompt-basket', JSON.stringify(this.promptBasket));
      this.showToast('已加入提示词篮');
    },
    showToast(msg) {
      const el = document.createElement('div');
      el.textContent = msg;
      Object.assign(el.style, {
        position: 'fixed', bottom: '24px', left: '50%', transform: 'translateX(-50%)',
        background: 'rgba(0,0,0,0.82)', color: '#fff', padding: '8px 20px',
        borderRadius: '999px', fontSize: '13px', fontWeight: '600', zIndex: '9999',
        pointerEvents: 'none', transition: 'opacity .3s ease',
      });
      document.body.appendChild(el);
      setTimeout(() => { el.style.opacity = '0'; }, 1400);
      setTimeout(() => { el.remove(); }, 1800);
    },
    handleResize() {
      this.isMobile = window.innerWidth < 768;
    },
  },
  mounted() {
    this.promptBasket = JSON.parse(localStorage.getItem('prompt-basket') || '[]');
    window.addEventListener('resize', this.handleResize);
  },
  beforeUnmount() {
    window.removeEventListener('resize', this.handleResize);
  },
}).mount('#app');
</script>
</body>
</html>
