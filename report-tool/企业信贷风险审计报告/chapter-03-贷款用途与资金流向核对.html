<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>企业信贷风险审计报告 · 贷款用途与资金流向核对</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <style id="token-css">
/* ========================================
   Design Token: 商务蓝白风格 (Business Blue-White)
   提取自: A4.html - 货币基金月度收益归因分析
   适用场景: A4打印报告、正式商务文档、金融分析报告
   ======================================== */

:root {
  /* ---- 色板 ---- */
  --bw-primary-50:  #eff6ff;
  --bw-primary-100: #dbeafe;
  --bw-primary-200: #bfdbfe;
  --bw-primary-300: #93c5fd;
  --bw-primary-500: #2563eb;
  --bw-primary-700: #1e3a8a;
  --bw-primary-800: #1e40af;
  --bw-primary-900: #0f172a;

  --bw-surface:       #ffffff;
  --bw-surface-alt:   #f8fafc;
  --bw-bg:            #f3f6fb;

  --bw-text:          #1f2937;
  --bw-text-muted:    #64748b;
  --bw-text-light:    #94a3b8;
  --bw-text-inverse:  #ffffff;

  --bw-border:        #e5e7eb;
  --bw-border-light:  #f1f5f9;

  --bw-accent-green:  #16a34a;
  --bw-accent-red:    #dc2626;
  --bw-accent-amber:  #d97706;

  /* ---- 排版 ---- */
  --bw-font:          "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
  --bw-font-mono:     "SF Mono", "Cascadia Code", monospace;

  --bw-text-h1:       40px;
  --bw-text-h2:       30px;
  --bw-text-h3:       18px;
  --bw-text-body:     15px;
  --bw-text-sm:       13px;
  --bw-text-xs:       12px;

  --bw-leading:       1.7;
  --bw-leading-head:  1.25;

  /* ---- 间距 ---- */
  --bw-page-padding-x: 22mm;
  --bw-page-padding-y: 18mm;
  --bw-card-padding:   18px;
  --bw-grid-gap:       16px;
  --bw-section-gap:    24px;

  /* ---- 圆角 ---- */
  --bw-radius-card:    14px;
  --bw-radius-table:   12px;
  --bw-radius-tag:     999px;
  --bw-radius-process: 0 12px 12px 0;

  /* ---- 阴影 ---- */
  --bw-shadow-card:    0 8px 24px rgba(15, 23, 42, 0.08);
  --bw-shadow-process: 0 6px 18px rgba(15, 23, 42, 0.06);

  /* ---- 页面 ---- */
  --bw-page-width:     297mm;
  --bw-page-height:    210mm;

  /* ---- 组件 Token ---- */
  --bw-cover-bg:       linear-gradient(135deg, var(--bw-primary-900), var(--bw-primary-700));
  --bw-table-th-bg:    var(--bw-primary-100);
  --bw-table-th-text:  var(--bw-primary-700);
  --bw-tag-bg:         var(--bw-primary-100);
  --bw-tag-text:       var(--bw-primary-800);
  --bw-big-number:     48px;
  --bw-big-number-color: var(--bw-primary-500);
  --bw-process-border: 4px solid var(--bw-primary-500);
  --bw-footer-text:    var(--bw-text-light);

  /* === 通用变量别名（组件使用这些变量，适配所有主题） === */
  --primary-50:      var(--bw-primary-50);
  --primary-100:     var(--bw-primary-100);
  --primary-200:     var(--bw-primary-200);
  --primary-300:     var(--bw-primary-300);
  --primary-400:     #3b82f6;
  --primary-500:     var(--bw-primary-500);
  --primary-700:     var(--bw-primary-700);
  --primary-800:     var(--bw-primary-800);
  --primary-900:     var(--bw-primary-900);
  --surface:         var(--bw-surface);
  --surface-alt:     var(--bw-surface-alt);
  --bg:              var(--bw-bg);
  --text:            var(--bw-text);
  --text-muted:      var(--bw-text-muted);
  --text-light:      var(--bw-text-light);
  --text-inverse:    var(--bw-text-inverse);
  --border:          var(--bw-border);
  --border-light:    var(--bw-border-light);
  --radius-card:     var(--bw-radius-card);
  --radius-tag:      var(--bw-radius-tag);
  --radius-circle:   999px;
  --shadow-card:     var(--bw-shadow-card);
  --font:            var(--bw-font);
  --font-display:    var(--bw-font);
  --accent-green:    var(--bw-accent-green);
  --accent-red:      var(--bw-accent-red);
  --accent-amber:    var(--bw-accent-amber);
  --big-number:      var(--bw-big-number);
  --big-number-color: var(--bw-big-number-color);
  --process-border:  var(--bw-process-border);
  --table-th-bg:     var(--bw-table-th-bg);
  --table-th-text:   var(--bw-table-th-text);
  --tag-bg:          var(--bw-tag-bg);
  --tag-text:        var(--bw-tag-text);
  --cover-bg:        var(--bw-cover-bg);
}
  </style>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bw: {
              primary: {
                50: '#eff6ff', 100: '#dbeafe', 200: '#bfdbfe', 300: '#93c5fd',
                500: '#2563eb', 700: '#1e3a8a', 800: '#1e40af', 900: '#0f172a',
              },
              surface: '#ffffff', alt: '#f8fafc', bg: '#f3f6fb',
              text: '#1f2937', muted: '#64748b', light: '#94a3b8', border: '#e5e7eb',
            }
          },
          fontFamily: {
            bw: ['"Microsoft YaHei"', '"PingFang SC"', 'Arial', 'sans-serif'],
          }
        }
      }
    };
  </script>

  <style>
    @page { size: A4 landscape; margin: 0; }
    .a4-page {
      width: 297mm; height: 210mm;
      padding: 18mm 22mm;
      page-break-after: always; break-after: page;
      position: relative; overflow: hidden;
    }
    .a4-page:last-child { page-break-after: auto; break-after: auto; }
    @media print {
      html, body { width: 297mm; height: 210mm; background: white; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .a4-page { margin: 0; box-shadow: none; }
    }
    @media screen {
      .a4-page { margin: 20px auto; box-shadow: 0 0 30px rgba(0,0,0,.12); border-radius: 4px; }
    }

    .data-table { width: 100%; border-collapse: collapse; font-size: 11px; }
    .data-table thead th {
      background: var(--table-th-bg); color: var(--table-th-text);
      padding: 8px 10px; text-align: left; font-weight: 700; white-space: nowrap;
    }
    .data-table tbody td {
      padding: 7px 10px; color: var(--text); line-height: 1.4;
      border-bottom: 1px solid var(--border-light);
    }
    .data-table.striped tbody tr:nth-child(even) td { background: var(--surface-alt); }
    .data-table.striped tbody tr:nth-child(odd) td { background: var(--surface); }

    .badge { display: inline-block; border-radius: var(--radius-tag); font-weight: 600; white-space: nowrap; }
    .badge-sm { padding: 2px 9px; font-size: 11px; }
    .badge-fill { background: var(--tag-bg); color: var(--tag-text); }
    .badge-accent-green { background: var(--accent-green); color: #fff; }
    .badge-accent-red { background: var(--accent-red); color: #fff; }
    .badge-accent-amber { background: var(--accent-amber); color: #fff; }
    .badge-outline-red { border: 1.5px solid var(--accent-red); color: var(--accent-red); background: transparent; }
    .badge-outline-amber { border: 1.5px solid var(--accent-amber); color: var(--accent-amber); background: transparent; }

    .card-box {
      background: var(--surface); border-radius: var(--radius-card);
      padding: 18px 22px; box-shadow: var(--shadow-card);
      border: 1px solid var(--border-light);
    }

    .stat-mini { text-align: center; }
    .stat-mini .val { font-size: 28px; font-weight: 700; line-height: 1; }
    .stat-mini .lbl { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

</head>
<body class="bg-bw-bg font-bw">

<div id="app">

  <!-- ===== 第1页：贷款用途核对总览 ===== -->
  <section class="a4-page" style="background: var(--surface-alt);">
    <h2 class="text-3xl font-bold mb-1" style="color: var(--text);">三、贷款用途与资金流向核对</h2>
    <p class="text-sm mb-4" style="color: var(--text-muted);">
      逐笔比对{{ meta.entity }}审计期间内贷款合同约定用途与实际资金去向，分析交易对手方关系，识别资金回流、短期拆借等违规行为
    </p>

    <!-- 概览指标行 -->
    <div class="grid grid-cols-4 gap-4 mb-4">
      <div class="card-box stat-mini">
        <div class="val" style="color: var(--big-number-color);">{{ summary.totalLoans }}</div>
        <div class="lbl">审计贷款笔数</div>
      </div>
      <div class="card-box stat-mini">
        <div class="val" style="color: var(--accent-green);">{{ summary.compliant }}</div>
        <div class="lbl">用途合规</div>
      </div>
      <div class="card-box stat-mini">
        <div class="val" style="color: var(--accent-amber);">{{ summary.attention }}</div>
        <div class="lbl">需关注</div>
      </div>
      <div class="card-box stat-mini">
        <div class="val" style="color: var(--accent-red);">{{ summary.violation }}</div>
        <div class="lbl">确认违规</div>
      </div>
    </div>

    <!-- 对比表 -->
    <div class="card-box" style="padding:12px 16px;">
      <table class="data-table striped">
        <thead>
          <tr>
            <th>贷款编号</th>
            <th>金额</th>
            <th>合同约定用途</th>
            <th>实际资金去向</th>
            <th>交易对手方</th>
            <th>对手方关系</th>
            <th>偏差说明</th>
            <th>合规状态</th>
          </tr>
        </thead>
        <tbody>
          <tr v-for="(loan, i) in loanTable" :key="i">
            <td class="font-semibold">{{ loan.id }}</td>
            <td>{{ loan.amount }}</td>
            <td>{{ loan.contractUse }}</td>
            <td :style="loan.deviation ? 'color:var(--accent-red);' : ''">{{ loan.actualFlow }}</td>
            <td>{{ loan.counterparty }}</td>
            <td>{{ loan.relation }}</td>
            <td :style="loan.deviation ? 'color:var(--accent-red);' : 'color:var(--text-muted);'">{{ loan.note }}</td>
            <td><span class="badge badge-sm" :class="loan.badgeClass">{{ loan.statusLabel }}</span></td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="absolute bottom-[10mm] right-[22mm] text-xs" style="color: var(--text-muted);">05</div>
  </section>

  <!-- ===== 第2页：违规行为标注 + 资金链路 ===== -->
  <section class="a4-page" style="background: var(--surface-alt);">
    <h2 class="text-3xl font-bold mb-4" style="color: var(--text);">违规行为标注与资金链路追踪</h2>

    <!-- 违规卡片 2x2 -->
    <div class="grid grid-cols-2 gap-4 mb-5">
      <div v-for="(v, i) in violations" :key="i"
           class="rounded-xl p-5 shadow-lg" style="background: var(--surface); border-left: 4px solid var(--accent-red);">
        <div class="flex items-center gap-2.5 mb-2.5">
          <span class="badge badge-sm" :class="v.riskClass">{{ v.riskLevel }}风险</span>
          <h3 class="text-base font-bold" style="color: var(--text);">{{ v.title }}</h3>
        </div>
        <p class="text-sm leading-relaxed mb-3" style="color: var(--text-muted);">{{ v.desc }}</p>
        <div class="flex gap-5 text-xs" style="color: var(--text-light);">
          <span>涉及金额 <b :style="{color: v.riskColor}">{{ v.amount }}</b></span>
          <span>发生期间 {{ v.period }}</span>
        </div>
      </div>
    </div>

    <!-- 资金回流链路 -->
    <div class="card-box">
      <h3 style="color: var(--primary-700); font-size: 15px; font-weight: 700;">资金回流典型链路 · 交易路径还原</h3>
      <div class="grid grid-cols-3 gap-4 mt-3">
        <div v-for="(flow, i) in flowChains" :key="i"
             class="rounded-xl p-4" style="background: var(--surface-alt); border: 1px solid var(--border-light);">
          <div class="flex items-center gap-2.5 mb-3">
            <div class="w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold flex-shrink-0"
                 style="background: var(--primary-500); color: #fff;">{{ i + 1 }}</div>
            <span class="text-sm font-bold" style="color: var(--text);">{{ flow.loanId }}</span>
          </div>
          <div class="text-xs leading-relaxed mb-3 space-y-1">
            <div><span style="color: var(--text-muted);">源账户：</span><span style="color: var(--text);">{{ flow.source }}</span></div>
            <div><span style="color: var(--text-muted);">中转方：</span><span style="color: var(--accent-red); font-weight: 700;">{{ flow.intermediary }}</span></div>
            <div><span style="color: var(--text-muted);">最终去向：</span><span style="color: var(--accent-amber); font-weight: 700;">{{ flow.destination }}</span></div>
          </div>
          <div class="flex flex-wrap gap-1.5">
            <span v-for="tag in flow.tags" :key="tag" class="badge badge-sm" :class="tag.class">{{ tag.label }}</span>
          </div>
        </div>
      </div>
    </div>

    <div class="absolute bottom-[10mm] right-[22mm] text-xs" style="color: var(--text-muted);">06</div>
  </section>

  <!-- ===== 第3页：审计结论与整改建议 ===== -->
  <section class="a4-page" style="background: var(--surface-alt);">
    <h2 class="text-3xl font-bold mb-4" style="color: var(--text);">资金用途审计结论与整改建议</h2>

    <!-- 结论大数字 -->
    <div class="grid grid-cols-2 gap-5 mb-5">
      <div class="card-box flex items-center gap-5">
        <div class="text-5xl font-bold" style="color: var(--accent-green);">85<span class="text-xl">%</span></div>
        <div>
          <div class="text-base font-bold mb-1" style="color: var(--text);">用途匹配率</div>
          <div class="text-sm leading-relaxed" style="color: var(--text-muted);">{{ summary.compliant }}/{{ summary.totalLoans }} 笔贷款合同用途与实际去向基本一致</div>
        </div>
      </div>
      <div class="card-box flex items-center gap-5">
        <div class="text-5xl font-bold" style="color: var(--accent-red);">3<span class="text-xl">笔</span></div>
        <div>
          <div class="text-base font-bold mb-1" style="color: var(--text);">确认违规</div>
          <div class="text-sm leading-relaxed" style="color: var(--text-muted);">涉及资金回流、关联方短期拆借及个人账户资金占用</div>
        </div>
      </div>
    </div>

    <!-- 违规汇总表 -->
    <div class="card-box mb-5" style="padding:14px 18px;">
      <h3 style="color: var(--primary-700); font-size: 15px; font-weight: 700;">违规行为汇总</h3>
      <table class="data-table mt-2" style="font-size:12px;">
        <thead>
          <tr>
            <th>贷款编号</th>
            <th>违规类型</th>
            <th>涉及金额</th>
            <th>资金去向</th>
            <th>风险等级</th>
            <th>整改要求</th>
          </tr>
        </thead>
        <tbody>
          <tr v-for="(v, i) in violationSummary" :key="i">
            <td class="font-semibold">{{ v.id }}</td>
            <td><span class="badge badge-sm" :class="v.typeClass">{{ v.type }}</span></td>
            <td class="font-bold" style="color: var(--accent-red);">{{ v.amount }}</td>
            <td>{{ v.dest }}</td>
            <td><span class="badge badge-sm" :class="v.riskClass">{{ v.risk }}</span></td>
            <td style="color: var(--text-muted);">{{ v.action }}</td>
          </tr>
        </tbody>
      </table>
    </div>

    <!-- 整改建议 -->
    <div class="card-box">
      <h3 style="color: var(--primary-700); font-size: 15px; font-weight: 700;">整改建议</h3>
      <div class="grid grid-cols-3 gap-4 mt-3">
        <div v-for="(rec, i) in recommendations" :key="i"
             class="flex gap-3">
          <div class="flex-shrink-0 w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold"
               style="background: var(--primary-100); color: var(--primary-700);">{{ i + 1 }}</div>
          <div>
            <div class="text-sm font-bold mb-1" style="color: var(--text);">{{ rec.title }}</div>
            <div class="text-xs leading-relaxed" style="color: var(--text-muted);">{{ rec.desc }}</div>
          </div>
        </div>
      </div>
    </div>

    <div class="absolute bottom-[10mm] right-[22mm] text-xs" style="color: var(--text-muted);">07</div>
  </section>

</div>

<script>
  const { createApp } = Vue;
  createApp({
    data() {
      return {
        meta: { entity: 'XX集团有限公司' },
        summary: { totalLoans: '20', compliant: '15', attention: '2', violation: '3' },
        loanTable: [
          { id:'LK-2024-001', amount:'2,000万', contractUse:'设备采购（生产线升级）', actualFlow:'设备供应商付款', counterparty:'XX机械制造有限公司', relation:'非关联方', note:'金额一致，用途匹配', deviation:false, statusLabel:'合规', badgeClass:'badge-fill' },
          { id:'LK-2024-002', amount:'1,500万', contractUse:'原材料采购（钢材）', actualFlow:'原材料采购付款', counterparty:'XX钢铁贸易有限公司', relation:'非关联方', note:'分3笔支付，与合同一致', deviation:false, statusLabel:'合规', badgeClass:'badge-fill' },
          { id:'LK-2024-003', amount:'3,000万', contractUse:'补充流动资金', actualFlow:'转入关联企业账户', counterparty:'YY投资控股有限公司', relation:'同一实控人', note:'经2次中转后回流关联方', deviation:true, statusLabel:'违规', badgeClass:'badge-accent-red' },
          { id:'LK-2024-005', amount:'800万', contractUse:'支付工程款', actualFlow:'部分转入个人账户', counterparty:'张某某（项目经理）', relation:'疑似关联自然人', note:'38%转入个人账户后转回', deviation:true, statusLabel:'违规', badgeClass:'badge-accent-red' },
          { id:'LK-2025-001', amount:'2,500万', contractUse:'偿还银行贷款', actualFlow:'偿还银行贷款', counterparty:'ZZ银行分行', relation:'非关联方', note:'金额匹配，路径清晰', deviation:false, statusLabel:'合规', badgeClass:'badge-fill' },
          { id:'LK-2025-002', amount:'1,200万', contractUse:'技术研发投入', actualFlow:'支付研发外包费', counterparty:'XX科技服务公司', relation:'非关联方', note:'合同与付款一致', deviation:false, statusLabel:'合规', badgeClass:'badge-fill' },

        ],
        violations: [
          { title:'资金回流至关联方', desc:'贷款LK-2024-003（3,000万元）名义上补充流动资金，实际经YY投资控股中转后回流至同一实控人名下企业，存在信贷资金挪用风险。', amount:'3,000万元', period:'2024.Q3', riskLevel:'高', riskClass:'badge-accent-red', riskColor:'var(--accent-red)' },
