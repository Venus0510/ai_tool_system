<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>报告工具 · 项目配置</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Arial, sans-serif; background: #f1f5f9; color: #1e293b; }
    [v-cloak] { display: none; }

    .app-shell { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
    .topbar { display: flex; align-items: center; justify-content: space-between; padding: 10px 24px; background: #fff; border-bottom: 1px solid #e2e8f0; flex-shrink: 0; }
    .topbar h1 { font-size: 17px; font-weight: 800; color: #0f172a; }
    .app-body { display: flex; flex: 1; overflow: hidden; }
    .sidebar { width: 280px; flex-shrink: 0; background: #fff; border-right: 1px solid #e2e8f0; display: flex; flex-direction: column; }
    .sidebar-header { padding: 20px; border-bottom: 1px solid #e2e8f0; }
    .sidebar-header h1 { font-size: 18px; font-weight: 800; color: #0f172a; margin-bottom: 4px; }
    .sidebar-header .sub { font-size: 12px; color: #94a3b8; }
    .project-list { flex: 1; overflow-y: auto; padding: 12px; }
    .project-item { padding: 12px 14px; border-radius: 10px; cursor: pointer; margin-bottom: 6px; border: 2px solid transparent; transition: all .12s ease; }
    .project-item:hover { background: #f8fafc; border-color: #e2e8f0; }
    .project-item.active { background: #eff6ff; border-color: #3b82f6; }
    .project-item .name { font-size: 14px; font-weight: 700; margin-bottom: 4px; }
    .project-item .meta { font-size: 11px; color: #94a3b8; display: flex; gap: 12px; }
    .new-btn { margin: 12px; padding: 10px; border-radius: 10px; border: 2px dashed #cbd5e1; cursor: pointer; text-align: center; font-size: 13px; font-weight: 600; color: #64748b; background: transparent; transition: all .12s; }
    .new-btn:hover { border-color: #3b82f6; color: #3b82f6; background: #eff6ff; }

    .main { flex: 1; overflow-y: auto; padding: 24px 32px; }
    .section { background: #fff; border-radius: 14px; padding: 24px; margin-bottom: 20px; border: 1px solid #e2e8f0; }
    .section h2 { font-size: 16px; font-weight: 700; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
    .section h2 .num { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 50%; background: #3b82f6; color: #fff; font-size: 12px; font-weight: 800; flex-shrink: 0; }
    .section-desc { font-size: 12px; color: #94a3b8; margin-bottom: 16px; }

    /* Card selection */
    .card-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
    .select-card { padding: 16px; border-radius: 12px; border: 2px solid #e2e8f0; cursor: pointer; transition: all .15s; text-align: center; }
    .select-card:hover { border-color: #93c5fd; }
    .select-card.selected { border-color: #3b82f6; background: #eff6ff; }
    .select-card .label { font-size: 13px; font-weight: 700; margin-bottom: 2px; }
    .select-card .hint { font-size: 11px; color: #94a3b8; }
    .select-card.selected .label { color: #1d4ed8; }

    /* Layout previews */
    .preview-a4 { width: 80px; height: 56px; margin: 0 auto 10px; border-radius: 4px; background: #f8fafc; border: 1px solid #cbd5e1; position: relative; }
    .preview-a4::after { content: ''; position: absolute; inset: 6px; border: 1px dashed #e2e8f0; border-radius: 2px; }
    .preview-slide { width: 56px; height: 56px; margin: 0 auto 10px; border-radius: 4px; background: #f8fafc; border: 1px solid #cbd5e1; position: relative; }
    .preview-slide::after { content: ''; position: absolute; inset: 6px; border: 1px dashed #e2e8f0; border-radius: 2px; }
    .preview-scroll { width: 48px; height: 72px; margin: 0 auto 10px; border-radius: 4px; background: #f8fafc; border: 1px solid #cbd5e1; position: relative; }
    .select-card.selected .preview-a4, .select-card.selected .preview-slide, .select-card.selected .preview-scroll { border-color: #93c5fd; }

    /* Theme color swatches */
    .swatches { display: flex; gap: 3px; justify-content: center; margin-bottom: 10px; }
    .swatch { width: 18px; height: 18px; border-radius: 4px; }

    /* Component thumbnails */
    .comp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 8px; margin-bottom: 12px; }
    .comp-thumb { padding: 10px 8px; border-radius: 10px; border: 2px solid #e2e8f0; cursor: pointer; text-align: center; transition: all .12s; font-size: 11px; }
    .comp-thumb:hover { border-color: #93c5fd; }
    .comp-thumb.selected { border-color: #3b82f6; background: #eff6ff; }
    .comp-thumb .icon { width: 48px; height: 36px; margin: 0 auto 6px; border-radius: 4px; background: #f8fafc; border: 1px solid #e2e8f0; position: relative; }
    .comp-thumb.selected .icon { border-color: #93c5fd; }

    /* Chapter accordion + drag */
    .chapter { border: 1px solid #e2e8f0; border-radius: 10px; margin-bottom: 10px; overflow: hidden; transition: opacity .15s; }
    .chapter.dragging { opacity: 0.4; }
    .chapter.drag-over { border-color: #3b82f6; border-style: dashed; background: #f8faff; }
    .chapter-header { display: flex; align-items: center; gap: 8px; padding: 12px 12px 12px 8px; cursor: pointer; background: #f8fafc; user-select: none; }
    .chapter-header:hover { background: #f1f5f9; }
    .drag-handle { cursor: grab; color: #94a3b8; font-size: 14px; padding: 2px 4px; letter-spacing: 1px; line-height: 1; flex-shrink: 0; }
    .drag-handle:active { cursor: grabbing; }
    .chapter-header .arrow { font-size: 10px; transition: transform .15s; color: #94a3b8; }
    .chapter-header .arrow.open { transform: rotate(90deg); }
    .chapter-header .title { flex: 1; font-size: 14px; font-weight: 600; }
    .chapter-body { padding: 0 16px 16px; display: none; }
    .chapter-body.open { display: block; }
    .chapter-header .status { font-size: 11px; padding: 2px 10px; border-radius: 999px; font-weight: 600; }
    .status-pending { background: #f1f5f9; color: #94a3b8; }
    .status-draft { background: #fef3c7; color: #92400e; }
    .status-done { background: #dcfce7; color: #166534; }

    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 12px; font-weight: 700; color: #475569; margin-bottom: 4px; }
    .form-group input, .form-group textarea { width: 100%; padding: 8px 12px; border-radius: 8px; border: 1px solid #d1d5db; font-size: 13px; font-family: inherit; resize: vertical; }
    .form-group textarea { min-height: 56px; }
    .form-group input:focus, .form-group textarea:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.08); }

    .btn { padding: 8px 16px; border-radius: 8px; border: 1px solid #d1d5db; cursor: pointer; font-size: 13px; font-weight: 600; background: #fff; color: #374151; display: inline-flex; align-items: center; gap: 6px; }
    .btn:hover { background: #f9fafb; }
    .btn.primary { background: #3b82f6; color: #fff; border-color: #3b82f6; }
    .btn.primary:hover { background: #2563eb; }
    .btn.danger { color: #dc2626; border-color: #fecaca; }
    .btn.danger:hover { background: #fef2f2; }
    .btn.sm { padding: 4px 10px; font-size: 11px; }
    .btn.success { background: #16a34a; color: #fff; border-color: #16a34a; }
    .btn.success:hover { background: #15803d; }

    .hint-box { background: #f0f9ff; border: 1px solid #bae6fd; border-radius: 10px; padding: 14px 18px; font-size: 13px; color: #0c4a6e; line-height: 1.6; margin-bottom: 14px; }
    .hint-box.warn { background: #fffbeb; border-color: #fde68a; color: #92400e; }

    .file-input-wrap { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .file-hint { font-size: 11px; color: #94a3b8; }
    .save-status { font-size: 12px; display: flex; align-items: center; gap: 4px; }

    @media (max-width: 768px) {
      .app-shell { flex-direction: column; }
      .sidebar { width: 100%; height: auto; max-height: 200px; flex-shrink: 0; }
      .main { padding: 16px; }
      .card-row { grid-template-columns: repeat(3, 1fr); gap: 8px; }
      .comp-grid { grid-template-columns: repeat(3, 1fr); }
    }
  </style>
</head>
<body>
<div id="app" v-cloak>
  <div class="app-shell">
    <!-- ====== 顶部栏 ====== -->
    <header class="topbar">
      <h1>报告工具</h1>
      <div style="font-size:12px;color:#94a3b8;">配置驱动 · Claude Code 生成</div>
    </header>
    <div class="app-body">
    <!-- ====== 左侧：项目列表 ====== -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h1>项目列表</h1>
        <div class="sub">配置驱动 · 分章生成</div>
      </div>
      <button class="new-btn" @click="createProject">＋ 新建项目</button>
      <div class="project-list">
        <div v-for="p in projects" :key="p.name"
             class="project-item" :class="{ active: currentProject?.name === p.name }"
             @click="openProject(p)">
          <div class="name">{{ p.name }}</div>
          <div class="meta">
            <span>{{ layoutLabel(p.layout) }}</span>
            <span>{{ doneCount(p) }}/{{ p.chapters?.length || 0 }}章完成</span>
            <span style="color:#ef4444;cursor:pointer;margin-left:auto;" @click.stop="deleteProject(p)">删除</span>
          </div>
        </div>
        <div v-if="!projects.length" style="text-align:center;padding:32px 16px;color:#94a3b8;font-size:13px;">
          暂无项目，点击上方按钮新建
        </div>
      </div>
      <div style="padding:12px;border-top:1px solid #e2e8f0;display:flex;gap:8px;">
        <button class="btn sm" @click="exportAll" title="导出全部项目为JSON备份">导出全部</button>
        <input type="file" id="importFile" accept=".json" style="display:none" @change="importAll" />
        <button class="btn sm" @click="document.getElementById('importFile').click()">导入</button>
      </div>
    </aside>

    <!-- ====== 右侧：配置编辑 ====== -->
    <main class="main">
      <div v-if="!currentProject" style="display:flex;align-items:center;justify-content:center;height:100%;color:#94a3b8;font-size:15px;">
        ← 选择或新建一个项目开始配置
      </div>

      <template v-if="currentProject">
        <!-- ① 基本设置 -->
        <section class="section">
          <h2><span class="num">1</span>基本设置</h2>
          <p class="section-desc">选择版式和主题，决定报告的输出格式和视觉风格。</p>

          <div class="form-group"><label>版式 · 输出格式</label></div>
          <div class="card-row">
            <div v-for="l in layouts" :key="l.id" class="select-card" :class="{ selected: currentProject.layout === l.id }" @click="currentProject.layout = l.id">
              <div :class="l.previewClass"></div>
              <div class="label">{{ l.label }}</div>
              <div class="hint">{{ l.hint }}</div>
            </div>
          </div>

          <div class="form-group" style="margin-top:16px;"><label>主题 · 视觉风格</label></div>
          <div class="card-row">
            <div v-for="t in themes" :key="t.id" class="select-card" :class="{ selected: currentProject.theme === t.id }" @click="currentProject.theme = t.id">
              <div class="swatches">
                <span v-for="c in t.colors" :key="c" class="swatch" :style="{ background: c }"></span>
              </div>
              <div class="label">{{ t.label }}</div>
              <div class="hint">{{ t.hint }}</div>
            </div>
          </div>

          <div class="form-group" style="margin-top:16px;"><label>生成模式</label></div>
          <div style="display:flex;gap:12px;">
            <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:13px;">
              <input type="radio" v-model="currentProject.mode" value="chapter" />
              分章生成（推荐，长报告逐章处理，每章独立文件便于AI修改）
            </label>
            <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:13px;">
              <input type="radio" v-model="currentProject.mode" value="full" />
              一次性生成（适合3-5页短报告，单文件输出）
            </label>
          </div>
        </section>

        <!-- ② 章节定义 -->
        <section class="section">
          <h2><span class="num">2</span>章节定义</h2>
          <p class="section-desc">每章独立生成一个 HTML 文件，便于 AI 逐章处理和修改。拖拽 ⋮⋮ 图标可调整顺序。</p>

          <div v-for="(ch, idx) in currentProject.chapters" :key="ch.id"
               class="chapter" :class="{ dragging: dragIdx === idx, 'drag-over': dragOverIdx === idx }"
               draggable="true"
               @dragstart="onDragStart($event, idx)"
               @dragover.prevent="onDragOver($event, idx)"
               @dragleave="onDragLeave(idx)"
               @drop="onDrop($event, idx)"
               @dragend="onDragEnd">
            <div class="chapter-header" @click="toggleChapter(ch)">
              <span class="drag-handle" title="拖拽排序" @click.stop>⋮⋮</span>
              <span class="arrow" :class="{ open: ch._open }">▶</span>
              <span class="title">第{{ idx + 1 }}章 · {{ ch.title || '未命名' }}</span>
              <span class="status" :class="'status-' + ch.status">{{ statusLabel(ch.status) }}</span>
              <button class="btn danger sm" @click.stop="removeChapter(idx)">删除</button>
            </div>
            <div class="chapter-body" :class="{ open: ch._open }">
              <div class="form-group">
                <label>章节标题</label>
                <input v-model="ch.title" placeholder="如：产品表现概览" />
              </div>
              <div class="form-group">
                <label>内容描述（Claude 生成指令）</label>
                <textarea v-model="ch.desc" placeholder="描述这章要写什么，越详细越好。如：展示核心KPI指标：七日年化收益率2.15%、万份收益0.5892、产品规模156.8亿。用数据卡片网格布局，突出趋势方向。"></textarea>
              </div>

              <div class="form-group"><label>组件选择（点击缩略图勾选，可多选）</label></div>
              <div v-if="ch.customLayout" class="hint-box warn" style="margin-bottom:10px;font-size:12px;">
                <strong>自定义展示需求已填写，将优先采用。</strong>下方组件选择将被忽略，Claude 按自定义描述生成。
              </div>
              <div class="comp-grid" :style="{ opacity: ch.customLayout ? 0.45 : 1, pointerEvents: ch.customLayout ? 'none' : 'auto' }">
                <div v-for="comp in availableComponents" :key="comp.id"
                     class="comp-thumb" :class="{ selected: ch.components.includes(comp.id) }"
                     @click="toggleComponent(ch, comp.id)">
                  <div class="icon" v-html="comp.icon"></div>
                  <div style="font-weight:600;">{{ comp.label }}</div>
                  <div style="font-size:10px;color:#94a3b8;">{{ comp.hint }}</div>
                </div>
              </div>

              <div class="form-group">
                <label>自定义展示需求（可选，不选组件库组件时在此自由描述）</label>
                <textarea v-model="ch.customLayout" placeholder="如：左右两栏布局，左边3个核心数字纵向排列，右边一个趋势折线图，底部放数据来源说明。支持任何你想要的展示方式，Claude会按此描述实现。"></textarea>
              </div>

              <div class="form-group">
                <label>数据文件（可选，关联 data/ 下的数据源）</label>
                <div class="file-input-wrap">
                  <input v-model="ch.dataFile" placeholder="如：data/产品数据.csv" style="flex:1;" />
                  <span class="file-hint">支持 csv / xlsx / docx / pdf / txt / md / json</span>
                </div>
              </div>
            </div>
          </div>

          <button class="btn" @click="addChapter" style="margin-top:8px;">＋ 添加章节</button>
        </section>

        <!-- ③ 操作 -->
        <section class="section">
          <h2><span class="num">3</span>操作</h2>

          <div class="hint-box">
            <strong>配置已自动保存到浏览器。</strong>修改任何配置都会自动存入 localStorage。<br />
            点击下方<strong>"导出配置"</strong>下载 config.json，放入 report-tool/projects/项目名/ 目录。<br />
            然后切换到 <strong>Claude Code</strong> 对话窗口，说<strong>"开始生成报告"</strong>即可按配置逐章生成。
          </div>

          <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
            <button class="btn primary" @click="exportConfig">导出配置 (config.json)</button>
            <button class="btn" @click="copyConfig">复制配置到剪贴板</button>
            <span v-if="saveMsg" class="save-status" style="color:#16a34a;">
              ✓ {{ saveMsg }}
            </span>
          </div>
        </section>
      </template>
    </main>
    </div><!-- .app-body -->
  </div><!-- .app-shell -->
</div>

<script>
const { createApp } = Vue;
createApp({
  data() {
    return {
      projects: [],
      currentProject: null,
      dragIdx: -1,
      dragOverIdx: -1,
      saveMsg: '',
      saveOk: false,
      layouts: [
        { id: 'a4-landscape', label: 'A4 横版', hint: '适合打印、PDF导出，固定页宽297×210mm，每页独立排版', previewClass: 'preview-a4' },
        { id: 'slide-deck', label: 'Slide 翻页', hint: '全屏演示模式，支持键盘左右翻页，适合汇报、演讲场景', previewClass: 'preview-slide' },
        { id: 'scroll-page', label: '网页版', hint: '自适应布局，兼容PC端、平板、手机端浏览，适合在线分享', previewClass: 'preview-scroll' },
      ],
      themes: [
        { id: 'business-bluewhite', label: '商务蓝白', hint: '正式专业，适合金融、咨询、企业报告', colors: ['#0f172a','#2563eb','#dbeafe','#f8fafc','#e5e7eb'] },
        { id: 'rc-lightblue', label: 'RC 浅蓝', hint: '清爽现代，适合科技、互联网、产品介绍', colors: ['#0f5a96','#0891b2','#e0f2fe','#f0f9ff','#cbd5e1'] },
        { id: 'dark-tech', label: '暗黑科技', hint: '酷炫科技感，适合SaaS产品、技术方案、数据产品', colors: ['#0f172a','#1e293b','#6ea8ff','#9ee8c8','#334155'] },
      ],
      availableComponents: [],
      componentIcons: {
        'stat-card':        { hint: 'KPI指标', icon: '<div style="margin:6px 8px;height:3px;background:#cbd5e1;border-radius:2px;"></div><div style="margin:4px 8px 0;font-size:14px;font-weight:700;color:#3b82f6;">1.2亿</div>' },
        'timeline':         { hint: '里程碑', icon: '<div style="display:flex;align-items:center;justify-content:center;height:100%;gap:4px;"><span style="width:7px;height:7px;border-radius:50%;background:#3b82f6;"></span><span style="width:16px;height:1px;background:#cbd5e1;"></span><span style="width:7px;height:7px;border-radius:50%;background:#3b82f6;"></span><span style="width:16px;height:1px;background:#cbd5e1;"></span><span style="width:7px;height:7px;border-radius:50%;background:#94a3b8;"></span></div>' },
        'process-step':     { hint: '递进流程', icon: '<div style="margin:4px 6px;padding:3px 5px;border-left:3px solid #3b82f6;text-align:left;font-size:8px;color:#64748b;">1. 步骤</div><div style="margin:4px 6px;padding:3px 5px;border-left:3px solid #93c5fd;text-align:left;font-size:8px;color:#94a3b8;">2. 步骤</div>' },
        'circle-number':    { hint: '序号标记', icon: '<div style="display:flex;align-items:center;justify-content:center;height:100%;gap:4px;"><span style="display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;background:#dbeafe;color:#3b82f6;font-size:9px;font-weight:700;">1</span><span style="display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;background:#dbeafe;color:#3b82f6;font-size:9px;font-weight:700;">2</span><span style="display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;background:#e2e8f0;color:#94a3b8;font-size:9px;">3</span></div>' },
        'badge-tag':        { hint: '分类标记', icon: '<div style="display:flex;align-items:center;justify-content:center;height:100%;gap:3px;"><span style="padding:2px 6px;border-radius:999px;background:#dbeafe;color:#3b82f6;font-size:8px;font-weight:600;">T+1</span><span style="padding:2px 6px;border-radius:999px;background:#dcfce7;color:#16a34a;font-size:8px;font-weight:600;">↑</span></div>' },
        'data-table':       { hint: '结构化数据', icon: '<div style="margin:4px 6px;"><div style="display:flex;gap:0;"><span style="flex:1;height:4px;background:#dbeafe;"></span><span style="flex:1;height:4px;background:#dbeafe;"></span></div><div style="display:flex;gap:0;margin-top:3px;"><span style="flex:1;height:2px;background:#f1f5f9;"></span><span style="flex:1;height:2px;background:#f1f5f9;"></span></div><div style="display:flex;gap:0;margin-top:2px;"><span style="flex:1;height:2px;background:#f1f5f9;"></span><span style="flex:1;height:2px;background:#f1f5f9;"></span></div></div>' },
        'hero-card':        { hint: '封面/重点区', icon: '<div style="margin:2px 6px;height:18px;background:linear-gradient(135deg,#1e3a8a,#3b82f6);border-radius:3px;"></div><div style="margin:3px 8px;height:2px;background:#cbd5e1;border-radius:1px;"></div>' },
        'bar-chart':        { hint: '需ECharts', icon: '<div style="display:flex;align-items:flex-end;justify-content:center;height:100%;gap:3px;padding-bottom:4px;"><span style="width:6px;height:18px;background:#3b82f6;border-radius:1px;"></span><span style="width:6px;height:24px;background:#60a5fa;border-radius:1px;"></span><span style="width:6px;height:12px;background:#93c5fd;border-radius:1px;"></span><span style="width:6px;height:20px;background:#3b82f6;border-radius:1px;"></span></div>' },
        'timeline-chart':   { hint: '需ECharts', icon: '<div style="position:relative;height:100%;"><svg viewBox="0 0 48 36" style="width:100%;height:100%;"><polyline points="4,28 16,20 24,14 36,8 44,16" fill="none" stroke="#3b82f6" stroke-width="2"/><circle cx="16" cy="20" r="2" fill="#3b82f6"/><circle cx="24" cy="14" r="2" fill="#3b82f6"/><circle cx="36" cy="8" r="2" fill="#3b82f6"/></svg></div>' },
      },
    };
  },
  methods: {
    /* === 项目管理（localStorage） === */
    loadProjects() {
      try {
        const raw = localStorage.getItem('report-tool-projects');
        this.projects = raw ? JSON.parse(raw) : [];
      } catch {
        this.projects = [];
      }
      this.projects.forEach(p => {
        p.chapters = p.chapters || [];
        p.chapters.forEach(ch => { ch._open = ch._open ?? true; });
      });
    },
    saveToStorage() {
      const clean = this.projects.map(p => {
        const { _dirHandle, ...rest } = p;
        return { ...rest, chapters: p.chapters.map(({ _open, ...c }) => ({ ...c })) };
      });
      localStorage.setItem('report-tool-projects', JSON.stringify(clean));
      this.saveMsg = '已保存 ' + new Date().toLocaleTimeString('zh-CN', { hour12: false });
      this.saveOk = true;
    },
    /* === 从 manifest.json 加载组件列表 === */
    async loadManifest() {
      try {
        const res = await fetch('../UI-lib/manifest.json');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const manifest = await res.json();
        const compCategories = ['basic-components', 'charts'];
        const items = [];
        for (const cat of (manifest.menu || [])) {
          if (!compCategories.includes(cat.id)) continue;
          for (const child of (cat.children || [])) {
            const iconInfo = this.componentIcons[child.id] || { hint: '', icon: '<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:10px;color:#94a3b8;">' + child.label + '</div>' };
            items.push({
              id: child.id,
              label: child.label,
              hint: iconInfo.hint,
              icon: iconInfo.icon,
            });
          }
        }
        if (items.length > 0) this.availableComponents = items;
      } catch (e) {
        // manifest 加载失败时回退到硬编码列表
        console.warn('加载 manifest.json 失败，使用内置组件列表', e);
        this.availableComponents = this.availableComponents.length > 0 ? this.availableComponents : [
          { id: 'stat-card', label: '数据卡片', hint: 'KPI指标', icon: this.componentIcons['stat-card'].icon },
          { id: 'timeline', label: '时间线', hint: '里程碑', icon: this.componentIcons['timeline'].icon },
          { id: 'process-step', label: '流程步骤', hint: '递进流程', icon: this.componentIcons['process-step'].icon },
          { id: 'circle-number', label: '圆形编号', hint: '序号标记', icon: this.componentIcons['circle-number'].icon },
          { id: 'badge-tag', label: '标签徽章', hint: '分类标记', icon: this.componentIcons['badge-tag'].icon },
          { id: 'data-table', label: '数据表格', hint: '结构化数据', icon: this.componentIcons['data-table'].icon },
          { id: 'hero-card', label: '封面卡片', hint: '封面/重点区', icon: this.componentIcons['hero-card'].icon },
          { id: 'bar-chart', label: '柱状图', hint: '需ECharts', icon: this.componentIcons['bar-chart'].icon },
          { id: 'timeline-chart', label: '时间线图', hint: '需ECharts', icon: this.componentIcons['timeline-chart'].icon },
        ];
      }
    },
    createProject() {
      const name = prompt('请输入项目名称（将作为文件夹名）：');
      if (!name || !name.trim()) return;
      if (this.projects.find(p => p.name === name.trim())) {
        alert('项目名已存在，请换一个。');
        return;
      }

      const project = {
        name: name.trim(),
        createdAt: new Date().toISOString(),
        updatedAt: new Date().toISOString(),
        layout: 'a4-landscape',
        theme: 'business-bluewhite',
        mode: 'chapter',
        chapters: [
          { id: 'cover', order: 1, title: '封面', desc: '报告封面页，包含标题、副标题、日期', components: ['hero-card'], customLayout: null, dataFile: null, status: 'pending' },
          { id: 'chapter-2', order: 2, title: '', desc: '', components: [], customLayout: null, dataFile: null, status: 'pending' },
        ],
      };

      this.projects.unshift(project);
      this.saveToStorage();
      this.currentProject = project;
    },
    openProject(p) {
      this.currentProject = p;
      this.saveMsg = '';
      p.chapters.forEach(ch => { ch._open = ch._open ?? true; });
    },
    deleteProject(p) {
      if (!confirm(`确定删除项目"${p.name}"？此操作不可恢复。`)) return;
      this.projects = this.projects.filter(x => x !== p);
      if (this.currentProject === p) this.currentProject = null;
      this.saveToStorage();
    },

    /* === 章节管理 === */
    addChapter() {
      if (!this.currentProject) return;
      const idx = this.currentProject.chapters.length + 1;
      this.currentProject.chapters.push({
        id: 'chapter-' + Date.now(),
        order: idx,
        title: '',
        desc: '',
        components: [],
        customLayout: null,
        dataFile: null,
        status: 'pending',
        _open: true,
      });
      this.saveToStorage();
    },
    removeChapter(idx) {
      this.currentProject.chapters.splice(idx, 1);
      this.currentProject.chapters.forEach((ch, i) => ch.order = i + 1);
      this.saveToStorage();
    },
    toggleChapter(ch) {
      ch._open = !ch._open;
    },
    toggleComponent(ch, compId) {
      const idx = ch.components.indexOf(compId);
      if (idx >= 0) ch.components.splice(idx, 1);
      else ch.components.push(compId);
    },

    /* === 拖拽排序 === */
    onDragStart(e, idx) {
      this.dragIdx = idx;
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', String(idx));
    },
    onDragOver(e, idx) {
      if (this.dragIdx === -1 || this.dragIdx === idx) return;
      this.dragOverIdx = idx;
      e.dataTransfer.dropEffect = 'move';
    },
    onDragLeave(idx) {
      if (this.dragOverIdx === idx) this.dragOverIdx = -1;
    },
    onDrop(e, idx) {
      this.dragOverIdx = -1;
      const fromIdx = this.dragIdx;
      if (fromIdx === -1 || fromIdx === idx) return;
      const chapters = this.currentProject.chapters;
      const [moved] = chapters.splice(fromIdx, 1);
      chapters.splice(idx, 0, moved);
      chapters.forEach((ch, i) => ch.order = i + 1);
      this.saveToStorage();
    },
    onDragEnd() {
      this.dragIdx = -1;
      this.dragOverIdx = -1;
    },

    /* === 导出 / 复制配置 === */
    exportConfig() {
      const p = this.currentProject;
      if (!p) return;
      const clean = {
        projectName: p.name,
        createdAt: p.createdAt,
        updatedAt: new Date().toISOString(),
        layout: p.layout,
        theme: p.theme,
        mode: p.mode,
        chapters: p.chapters.map(({ _open, ...c }) => ({ ...c })),
      };
      const blob = new Blob([JSON.stringify(clean, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'config.json';
      a.click();
      URL.revokeObjectURL(url);
      this.saveMsg = 'config.json 已下载';
      this.saveOk = true;
    },
    async copyConfig() {
      const p = this.currentProject;
      if (!p) return;
      const clean = {
        projectName: p.name,
        createdAt: p.createdAt,
        updatedAt: new Date().toISOString(),
        layout: p.layout,
        theme: p.theme,
        mode: p.mode,
        chapters: p.chapters.map(({ _open, ...c }) => ({ ...c })),
      };
      try {
        await navigator.clipboard.writeText(JSON.stringify(clean, null, 2));
        this.saveMsg = '配置已复制到剪贴板';
        this.saveOk = true;
      } catch {
        this.saveMsg = '复制失败，请手动导出';
        this.saveOk = false;
      }
    },

    /* === 导入导出 === */
    exportAll() {
      const clean = this.projects.map(p => {
        const { _dirHandle, ...rest } = p;
        return { ...rest, chapters: p.chapters.map(({ _open, ...c }) => ({ ...c })) };
      });
      const blob = new Blob([JSON.stringify(clean, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'report-tool-projects-backup.json'; a.click();
      URL.revokeObjectURL(url);
    },
    importAll(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const data = JSON.parse(reader.result);
          const arr = Array.isArray(data) ? data : [data];
          arr.forEach(proj => {
            proj.chapters = proj.chapters || [];
            proj.layout = proj.layout || 'a4-landscape';
            proj.theme = proj.theme || 'business-bluewhite';
            proj.mode = proj.mode || 'chapter';
            if (!proj.createdAt) proj.createdAt = new Date().toISOString();
            proj.updatedAt = new Date().toISOString();
            const existing = this.projects.findIndex(p => p.name === proj.name);
            if (existing >= 0) this.projects[existing] = proj;
            else this.projects.unshift(proj);
          });
          this.saveToStorage();
          alert(`成功导入 ${arr.length} 个项目。`);
        } catch (err) {
          alert('导入失败：文件格式不正确。');
        }
      };
      reader.readAsText(file);
      e.target.value = '';
    },

    /* === 工具 === */
    layoutLabel(l) {
      const map = { 'a4-landscape': 'A4横版', 'slide-deck': 'Slide翻页', 'scroll-page': '网页版' };
      return map[l] || l;
    },
    doneCount(p) {
      return (p.chapters || []).filter(c => c.status === 'done').length;
    },
    statusLabel(s) {
      return { pending: '待生成', draft: '草稿', done: '已完成' }[s] || s;
    },
  },
  mounted() {
    this.loadProjects();
    this.loadManifest();
  },
}).mount('#app');

</script>

</body>
</html>
