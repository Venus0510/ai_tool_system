<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>货币基金分析报告 · 封面</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bw: {
              primary: {
                50: '#eff6ff', 100: '#dbeafe', 200: '#bfdbfe', 300: '#93c5fd',
                500: '#2563eb', 700: '#1e3a8a', 800: '#1e40af', 900: '#0f172a',
              },
              surface: '#ffffff', alt: '#f8fafc', bg: '#f3f6fb',
              text: '#1f2937', muted: '#64748b', light: '#94a3b8',
              border: '#e5e7eb',
            }
          },
          fontFamily: {
            bw: ['"Microsoft YaHei"', '"PingFang SC"', 'Arial', 'sans-serif'],
          }
        }
      }
    };
  </script>
  <style id="token-css">
    :root {
      --bw-primary-50:  #eff6ff;
      --bw-primary-100: #dbeafe;
      --bw-primary-200: #bfdbfe;
      --bw-primary-300: #93c5fd;
      --bw-primary-500: #2563eb;
      --bw-primary-700: #1e3a8a;
      --bw-primary-800: #1e40af;
      --bw-primary-900: #0f172a;
      --bw-surface:       #ffffff;
      --bw-surface-alt:   #f8fafc;
      --bw-bg:            #f3f6fb;
      --bw-text:          #1f2937;
      --bw-text-muted:    #64748b;
      --bw-text-light:    #94a3b8;
      --bw-text-inverse:  #ffffff;
      --bw-border:        #e5e7eb;
      --bw-border-light:  #f1f5f9;
      --bw-accent-green:  #16a34a;
      --bw-accent-red:    #dc2626;
      --bw-accent-amber:  #d97706;
      --bw-font:          "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
      --bw-radius-card:    14px;
      --bw-shadow-card:    0 8px 24px rgba(15, 23, 42, 0.08);
      --primary-50:      var(--bw-primary-50);
      --primary-100:     var(--bw-primary-100);
      --primary-200:     var(--bw-primary-200);
      --primary-300:     var(--bw-primary-300);
      --primary-500:     var(--bw-primary-500);
      --primary-700:     var(--bw-primary-700);
      --primary-800:     var(--bw-primary-800);
      --primary-900:     var(--bw-primary-900);
      --surface:         var(--bw-surface);
      --surface-alt:     var(--bw-surface-alt);
      --bg:              var(--bw-bg);
      --text:            var(--bw-text);
      --text-muted:      var(--bw-text-muted);
      --text-light:      var(--bw-text-light);
      --text-inverse:    var(--bw-text-inverse);
      --border:          var(--bw-border);
      --border-light:    var(--bw-border-light);
      --font:            var(--bw-font);
      --cover-bg:        linear-gradient(135deg, var(--bw-primary-900), var(--bw-primary-700));
    }
  </style>
  <style>
    @page { size: A4 landscape; margin: 0; }
    .a4-page {
      width: 297mm; height: 210mm;
      padding: 18mm 22mm;
      page-break-after: always; break-after: page;
      position: relative; overflow: hidden;
    }
    @media print {
      html, body { width: 297mm; height: 210mm; background: white; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .a4-page { margin: 0; box-shadow: none; }
    }
    @media screen {
      .a4-page { margin: 20px auto; box-shadow: 0 0 30px rgba(0,0,0,.12); border-radius: 4px; }
    }
  </style>
</head>
<body class="font-bw" style="background: var(--bg);">

<div id="app">
  <section class="a4-page flex flex-col justify-center"
           style="background: linear-gradient(135deg, #0f172a, #1e40af); color: #fff;">
    <h1 class="text-[44px] font-bold leading-tight mb-3" style="color: #fff;">
      货币基金分析报告
    </h1>
    <p class="text-2xl mb-8" style="color: rgba(255,255,255,0.7);">
      收益归因与投资策略评估
    </p>

    <p class="text-base max-w-2xl mb-10 leading-relaxed" style="color: rgba(255,255,255,0.6);">
      本报告从宏观流动性环境出发，对目标货币基金进行多维度的收益归因分析，
      结合同类产品横向对比与风险压力评估，为投资决策与管理优化提供数据支撑和策略建议。
    </p>

    <div class="grid grid-cols-3 gap-4">
      <div class="rounded-2xl p-5 shadow-lg" style="background: var(--surface); color: var(--text);">
        <div class="text-3xl mb-2">&#x1f4ca;</div>
        <h3 class="text-lg font-bold mb-2" style="color: var(--primary-700);">宏观环境分析</h3>
        <p class="text-sm leading-relaxed" style="color: var(--text-muted);">
          研判货币政策走向、资金面松紧及利率变动趋势，把脉货基底层资产的市场环境。
        </p>
      </div>
      <div class="rounded-2xl p-5 shadow-lg" style="background: var(--surface); color: var(--text);">
        <div class="text-3xl mb-2">&#x1f4c8;</div>
        <h3 class="text-lg font-bold mb-2" style="color: var(--primary-700);">收益归因拆解</h3>
        <p class="text-sm leading-relaxed" style="color: var(--text-muted);">
          从票息、杠杆、久期、交易策略及费用五个维度，量化拆解收益来源与贡献度。
        </p>
      </div>
      <div class="rounded-2xl p-5 shadow-lg" style="background: var(--surface); color: var(--text);">
        <div class="text-3xl mb-2">&#x1f3af;</div>
        <h3 class="text-lg font-bold mb-2" style="color: var(--primary-700);">投资策略建议</h3>
        <p class="text-sm leading-relaxed" style="color: var(--text-muted);">
          基于归因结论与风险预判，输出久期调整、杠杆优化及资产配置的实操建议。
        </p>
      </div>
    </div>

    <div class="absolute bottom-[10mm] right-[22mm] text-xs" style="color: rgba(255,255,255,0.4);">
      <span>2026年5月</span>
    </div>
  </section>
</div>

<script>
  const { createApp } = Vue;
  createApp({}).mount('#app');
</script>

</body>
</html>
